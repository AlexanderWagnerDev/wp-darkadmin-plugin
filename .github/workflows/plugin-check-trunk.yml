name: Plugin Check Trunk

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  plugin-check-trunk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Prepare clean plugin directory
      run: |
        mkdir ../plugin-clean
        rsync -av --exclude='.git' \
                  --exclude='.github' \
                  --exclude='tests' \
                  --exclude='vendor' \
                  --exclude='composer.json' \
                  --exclude='composer.lock' \
                  --exclude='phpunit.xml' \
                  --exclude='.distignore' \
                  --exclude='*.md' \
                  --exclude='readme-de.txt' \
                  ./ ../plugin-clean/
    - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e
      with:
        build-dir: '../plugin-clean'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        slug: "darkadmin-dark-mode-for-adminpanel"
